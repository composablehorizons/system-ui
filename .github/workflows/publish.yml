name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REF: v${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: macos-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install KPM
        run: npm install --global @composablehorizons/kpm@0.1.0
      - name: Prepare version, release notes, commit, and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/prepare-release.py
      - name: Verify tests and all platform publications
        run: ./gradlew jvmTest testAndroidHostTest publishToMavenLocal --no-configuration-cache --console=plain
      - name: Push release commit and tag
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_REF"; then
            git push --atomic origin HEAD:main "refs/tags/$RELEASE_REF"
          fi
      - name: Publish with KPM
        env:
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: NONE
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            test -n "${!name}" || { echo "Missing publishing credential: $name" >&2; exit 1; }
          done
          kpm publish

  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Extract release notes
        run: |
          version="${RELEASE_REF#v}"
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_REF."
          else
            gh release create "$RELEASE_REF" --verify-tag --draft --title "$RELEASE_REF" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
